[project]
name = "agrivibe"
version = "0.1.0"
description = "A system to help farmers manage their crops and livestock efficiently."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "agrivibe.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
